[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armada-ai"
version = "0.1.0"
description = "Terminal orchestration for Open Code and Claude Code agents"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "jinja2>=3.0",
]

[project.scripts]
armada = "armada_ai.cli:main"

[tool.setuptools.packages.find]
where = ["."]
