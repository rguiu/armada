[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armada-ai"
version = "0.3.1"
description = "Terminal orchestration for Open Code and Claude Code agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Armada Contributors"}
]
keywords = ["ai", "agents", "tmux", "llm", "orchestration", "claude", "opencode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: System :: Clustering",
]
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "websockets>=10.0",
    "qrcode>=7.0",
    "mcp>=1.0",
    "tomli>=1.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/rguiu/armada"
Repository = "https://github.com/rguiu/armada"
Issues = "https://github.com/rguiu/armada/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx2>=0.1",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.0",
]

[project.scripts]
armada = "armada_ai.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["armada_ai", "armada_ai.*"]

[tool.setuptools.exclude-package-data]
"tests" = ["*"]

[tool.setuptools.package-data]
"armada_ai" = ["templates/**", "static/**", "hooks/**", "bin/**", "skills/**", "armada-bash.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["armada_ai"]
omit = [
    "armada_ai/cli.py",
    "armada_ai/health.py",
    "armada_ai/tmux.py",
    "armada_ai/mcp_server.py",
    "armada_ai/templates/*",
    "armada_ai/bin/*",
    "armada_ai/hooks/*",
    "armada_ai/infrastructure/tmux_session.py",
    "armada_ai/infrastructure/deployment.py",
    "armada_ai/infrastructure/terminal_attach.py",
    "armada_ai/project_explorer.py",
    "armada_ai/transport/middleware.py",
    "armada_ai/transport/static_assets.py",
    "armada_ai/demodb.py",
]

[tool.coverage.report]
fail_under = 79
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
