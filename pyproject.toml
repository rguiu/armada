[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armada-ai"
version = "0.1.0"
description = "Terminal orchestration for Open Code and Claude Code agents"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "websockets>=12.0",
    "jinja2>=3.0",
    "qrcode>=8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx2>=0.1",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.0",
]

[project.scripts]
armada = "armada_ai.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["armada_ai"]
omit = [
    "armada_ai/cli.py",
    "armada_ai/health.py",
    "armada_ai/tmux.py",
    "armada_ai/templates/*",
    "armada_ai/bin/*",
    "armada_ai/hooks/*",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
